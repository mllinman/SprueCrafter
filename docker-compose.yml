version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sprucecrafter-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sprucecrafter}
      POSTGRES_USER: ${POSTGRES_USER:-sprucecrafter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sprucecrafter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sprucecrafter-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: sprucecrafter-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sprucecrafter-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sprucecrafter-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sprucecrafter}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sprucecrafter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-524288000}
      UPLOAD_FOLDER: /app/uploads
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./src/backend:/app/backend
      - uploads:/app/uploads
      - temp:/app/temp
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sprucecrafter-network
    restart: unless-stopped

  # Web/Frontend (for web-based SaaS)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sprucecrafter-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sprucecrafter}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sprucecrafter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key}
      FLASK_ENV: ${FLASK_ENV:-production}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
    volumes:
      - ./src/backend:/app/src/backend
      - ./public:/app/public
      - ./src/electron:/app/src/electron
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sprucecrafter-network
    restart: unless-stopped

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: sprucecrafter-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - web
    networks:
      - sprucecrafter-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  uploads:
  temp:

networks:
  sprucecrafter-network:
    driver: bridge
