---
apiVersion: v1
kind: Namespace
metadata:
  name: sprucecrafter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprucecrafter-config
  namespace: sprucecrafter
data:
  FLASK_ENV: "production"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "5000"
  MAX_CONTENT_LENGTH: "524288000"
  LOG_LEVEL: "INFO"
  ENABLE_REGISTRATION: "true"
  ENABLE_PHOTO_TO_MODEL: "true"
  ENABLE_CLOUD_STORAGE: "true"
  RATELIMIT_ENABLED: "true"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: sprucecrafter-secrets
  namespace: sprucecrafter
type: Opaque
stringData:
  SECRET_KEY: "change-this-in-production"
  JWT_SECRET_KEY: "change-this-jwt-secret"
  POSTGRES_PASSWORD: "change-this-password"
  REDIS_PASSWORD: "change-this-redis-password"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  SENTRY_DSN: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sprucecrafter-uploads-pvc
  namespace: sprucecrafter
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sprucecrafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: sprucecrafter
        - name: POSTGRES_USER
          value: sprucecrafter
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sprucecrafter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sprucecrafter
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sprucecrafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - "$(REDIS_PASSWORD)"
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: sprucecrafter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sprucecrafter
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprucecrafter-backend
  namespace: sprucecrafter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sprucecrafter-backend
  template:
    metadata:
      labels:
        app: sprucecrafter-backend
    spec:
      containers:
      - name: backend
        image: sprucecrafter/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: "postgresql://sprucecrafter:$(POSTGRES_PASSWORD)@postgres:5432/sprucecrafter"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: SECRET_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: JWT_SECRET_KEY
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: REDIS_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: sprucecrafter-secrets
              key: SENTRY_DSN
        envFrom:
        - configMapRef:
            name: sprucecrafter-config
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: temp
          mountPath: /app/temp
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: sprucecrafter-uploads-pvc
      - name: temp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sprucecrafter-backend
  namespace: sprucecrafter
spec:
  selector:
    app: sprucecrafter-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprucecrafter-web
  namespace: sprucecrafter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sprucecrafter-web
  template:
    metadata:
      labels:
        app: sprucecrafter-web
    spec:
      containers:
      - name: web
        image: sprucecrafter/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://sprucecrafter-backend:5000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sprucecrafter-web
  namespace: sprucecrafter
spec:
  selector:
    app: sprucecrafter-web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sprucecrafter-ingress
  namespace: sprucecrafter
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  tls:
  - hosts:
    - sprucecrafter.example.com
    secretName: sprucecrafter-tls
  rules:
  - host: sprucecrafter.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sprucecrafter-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sprucecrafter-web
            port:
              number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprucecrafter-backend-hpa
  namespace: sprucecrafter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sprucecrafter-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
