[phases.setup]
nixPkgs = ["python39", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python -c 'print(\"Build complete\")'"]

[start]
cmd = "sh -c 'export FLASK_APP=src/backend/app_saas.py && flask init-db && gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 src.backend.app_saas:app'"
