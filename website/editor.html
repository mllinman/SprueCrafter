<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - SprueCrafter Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --header-height: 50px;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Holy Grail Slicer Layout */
        .app-container {
            display: grid;
            grid-template-columns: 60px 1fr 320px;
            /* Toolbar | Viewport | Properties */
            grid-template-rows: var(--header-height) 1fr 30px;
            /* Header | Main | Status */
            height: 100vh;
            width: 100vw;
        }

        /* 1. Header (Menu Bar) */
        .header {
            grid-column: 1 / -1;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            justify-content: space-between;
        }

        .header-logo {
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        /* 2. Left Toolbar (Tools) */
        .toolbar-left {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 15px;
        }

        .tool-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tool-icon:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .tool-icon.active {
            background: var(--accent-primary);
            color: white;
        }

        .tool-tooltip {
            position: absolute;
            left: 50px;
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
            z-index: 100;
        }

        .tool-icon:hover .tool-tooltip {
            opacity: 1;
        }

        /* 3. Center Viewport */
        .viewport {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        #viewer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD overlays */
        .viewport-hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        /* 4. Right Sidebar (Properties) */
        .sidebar-right {
            grid-column: 3 / 4;
            grid-row: 2 / -1;
            /* Spans to bottom */
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* Tool Context Panels */
        .tool-panel {
            display: none;
        }

        .tool-panel.active {
            display: block;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            outline: none;
        }

        .form-range-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-full {
            width: 100%;
            padding: 10px;
            background: var(--accent-primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-full:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            margin-top: 0;
        }

        .btn-outline:hover {
            border-color: var(--text-primary);
        }

        /* 5. Status Bar */
        .status-bar {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- 1. Header -->
        <header class="header">
            <a href="dashboard.html" class="header-logo">
                <i class="fas fa-chevron-left"></i> SprueCrafter Studio
            </a>
            <div class="header-controls">
                <button class="form-control" style="width: auto; cursor: pointer;"
                    onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-folder-open"></i> Import
                </button>
                <button class="form-control"
                    style="width: auto; cursor: pointer; background: var(--success); border: none; color: #fff;">
                    <i class="fas fa-file-export"></i> Export Slice
                </button>
            </div>
            <input type="file" id="file-input" hidden accept=".stl,.obj,.fbx,.3ds,.ply,.gltf,.glb,.dae,.3mf">
        </header>

        <!-- 2. Left Toolbar -->
        <aside class="toolbar-left">
            <div class="tool-icon active" data-tool="layout" title="Layout">
                <i class="fas fa-th-large"></i>
                <span class="tool-tooltip">Layout & Prepare</span>
            </div>
            <div class="tool-icon" data-tool="transform" title="Transform">
                <i class="fas fa-arrows-alt"></i>
                <span class="tool-tooltip">Move / Rotate / Scale</span>
            </div>
            <div class="tool-icon" data-tool="supports" title="Supports">
                <i class="fas fa-layer-group"></i>
                <span class="tool-tooltip">Supports</span>
            </div>
            <div class="tool-icon" data-tool="sprues" title="Sprues">
                <i class="fas fa-project-diagram"></i>
                <span class="tool-tooltip">Sprue Generation</span>
            </div>
            <div style="flex: 1;"></div>
            <div class="tool-icon" data-tool="settings" title="Settings">
                <i class="fas fa-cog"></i>
            </div>
        </aside>

        <!-- 3. Viewport -->
        <main class="viewport">
            <div class="viewport-hud-top">
                <span><i class="fas fa-cube"></i> <span id="model-count">0</span> Objects</span>
                <span><i class="fas fa-database"></i> <span id="poly-count">0</span> Polys</span>
            </div>
            <canvas id="viewer-canvas"></canvas>
        </main>

        <!-- 4. Right Sidebar (Context Properties) -->
        <aside class="sidebar-right">

            <!-- Context: Layout (Default) -->
            <div id="panel-layout" class="tool-panel active">
                <div class="panel-header">
                    <span>Scene Graph</span>
                    <i class="fas fa-list"></i>
                </div>
                <div class="panel-content">
                    <div class="form-group">
                        <label class="form-label">Selected Model</label>
                        <input type="text" class="form-control" id="model-name" placeholder="No selection" readonly>
                    </div>

                    <button id="separate-parts-btn" class="btn-full btn-outline">
                        <i class="fas fa-object-ungroup"></i> Separate Parts
                    </button>
                    <button id="auto-orient-btn" class="btn-full btn-outline">
                        <i class="fas fa-magic"></i> Auto-Orientation (AI)
                    </button>
                    <button id="repair-mesh-btn" class="btn-full btn-outline">
                        <i class="fas fa-band-aid"></i> Repair Mesh
                    </button>
                </div>
            </div>

            <!-- Context: Transform -->
            <div id="panel-transform" class="tool-panel">
                <div class="panel-header">Transform</div>
                <div class="panel-content">
                    <div class="form-group">
                        <label class="form-label">Position (mm)</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="number" class="form-control" placeholder="X" id="pos-x">
                            <input type="number" class="form-control" placeholder="Y" id="pos-y">
                            <input type="number" class="form-control" placeholder="Z" id="pos-z">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Rotation (°)</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="number" class="form-control" placeholder="X" id="rot-x">
                            <input type="number" class="form-control" placeholder="Y" id="rot-y">
                            <input type="number" class="form-control" placeholder="Z" id="rot-z">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Scale (%)</label>
                        <input type="number" class="form-control" value="100" id="scale-val">
                    </div>
                    <button class="btn-full btn-outline" id="reset-transform-btn">Reset Transforms</button>
                </div>
            </div>

            <!-- Context: Supports -->
            <div id="panel-supports" class="tool-panel">
                <div class="panel-header">Smart Supports</div>
                <div class="panel-content">
                    <div class="form-group">
                        <label class="form-label">Support Density</label>
                        <div class="form-range-group">
                            <input type="range" class="form-control" min="0" max="100" value="50" id="support-density"
                                oninput="document.getElementById('density-value').textContent = this.value + '%'">
                            <span id="density-value" style="width: 40px; font-size: 0.8rem;">50%</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Overhang Angle</label>
                        <input type="number" class="form-control" value="45" id="overhang-angle">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Touchpoint Size (mm)</label>
                        <input type="number" class="form-control" value="0.4" step="0.1">
                    </div>
                    <button id="gen-supports-btn" class="btn-full">Generate Supports</button>

                    <hr style="border-color: var(--border-color); margin: 15px 0;">

                    <div class="form-group">
                        <label class="form-label">Build Plate Adhesion</label>
                        <select class="form-control" id="adhesion-type">
                            <option value="none">None (Skirt)</option>
                            <option value="raft">Raft (Full)</option>
                            <option value="brim">Brim</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Context: Sprues -->
            <div id="panel-sprues" class="tool-panel">
                <div class="panel-header">Sprue Generator</div>
                <div class="panel-content">
                    <div class="form-group">
                        <label class="form-label">Connector Type</label>
                        <select class="form-control" id="connector-type">
                            <option value="cylindrical">Cylindrical</option>
                            <option value="pyramid">Pyramid (Heavy)</option>
                            <option value="spherical">Spherical</option>
                        </select>
                    </div>
                    <button id="gen-sprue-btn" class="btn-full">Generate Auto-Layout</button>
                </div>
            </div>

            <!-- Global Print Settings (Always Visible at bottom) -->
            <div style="border-top: 1px solid var(--border-color); margin-top: auto; background: rgba(0,0,0,0.1);">
                <div class="panel-header" style="font-size: 0.9rem;">Print Config</div>
                <div class="panel-content" style="height: auto; max-height: 200px;">
                    <div class="form-group">
                        <label class="form-label">Printer</label>
                        <select class="form-control">
                            <option>Elegoo Saturn 2</option>
                            <option>Anycubic Photon M3</option>
                            <option>Phrozen Mega 8K</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Material / Resin</label>
                        <select class="form-control">
                            <option>Standard Grey 8k</option>
                            <option>ABS-Like Tough</option>
                            <option>Water Washable</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Layer Height (mm)</label>
                        <input type="number" class="form-control" value="0.05" step="0.01">
                    </div>
                </div>
            </div>

        </aside>

        <!-- 5. Status Bar -->
        <footer class="status-bar">
            <span id="status-msg">Ready</span>
            <span><i class="fas fa-ruler-combined"></i> X: <span id="dim-x">0</span> Y: <span id="dim-y">0</span> Z:
                <span id="dim-z">0</span> mm</span>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
</body>

</html>
