<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - SprueCrafter Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdns.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    
    <style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #00f2ff;
            --text-primary: #fff;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .scrollalble-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .tool-section {
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1.5rem;
        }

        .tool-section h4 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2ff 0%, #0077ff 100%);
            border: none;
            color: #000;
            font-weight: 600;
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.2);
            border-color: var(--accent-primary);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Viewport */
        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #viewer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Floating Toolbar */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        
        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active {
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent-primary);
            border-color: rgba(0, 242, 255, 0.3);
        }
        
        /* Status Bar */
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--panel-bg);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" style="color: #fff; text-decoration: none;">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h3 style="margin: 0; font-size: 1.1rem;">SprueCrafter Studio</h3>
            </div>
            
            <div class="scrollalble-content">
                
                <!-- File Tools -->
                <div class="tool-section">
                    <h4>Model Actions</h4>
                    <div class="control-group">
                        <button id="separate-btn" class="btn"><i class="fas fa-object-ungroup"></i> Separate Parts</button>
                    </div>
                    <div class="control-group">
                         <div class="btn-group">
                            <button id="rotate-model-btn" class="btn" title="Rotate +90 Z"><i class="fas fa-sync-alt"></i> Rotate (+90°)</button>
                         </div>
                    </div>
                    <input type="file" id="file-input" style="display: none;" accept=".stl,.obj">
                    <button onclick="document.getElementById('file-input').click()" class="btn btn-outline" style="margin-top: 10px;">
                        <i class="fas fa-folder-open"></i> Load New File
                    </button>
                </div>

                <!-- Supports -->
                <div class="tool-section">
                    <h4>Auto-Supports</h4>
                    <button id="generate-supports-btn" class="btn"><i class="fas fa-layer-group"></i> Generate Supports</button>
                </div>

                <!-- Sprue Settings -->
                <div class="tool-section" style="border-bottom: none;">
                    <h4>Sprue Generation</h4>
                    <div class="control-group">
                        <label class="control-label">Connector Type</label>
                        <select id="connector-type" class="btn" style="text-align: left;">
                            <option value="cylindrical">Cylindrical (Standard)</option>
                            <option value="pyramid">Pyramid (Strong)</option>
                            <option value="spherical">Spherical (Minimal)</option>
                        </select>
                    </div>
                    <button id="generate-sprue-btn" class="btn btn-primary"><i class="fas fa-magic"></i> Generate Sprue Layout</button>
                </div>

            </div>
        </div>

        <!-- 3D Viewport -->
        <div class="viewport">
            <!-- Toolbar -->
            <div class="toolbar">
                <button class="tool-btn active" title="Orbit"><i class="fas fa-cube"></i></button>
                <button class="tool-btn" title="Move"><i class="fas fa-arrows-alt"></i></button>
                <button class="tool-btn" title="Zoom" id="zoom-in-btn"><i class="fas fa-search-plus"></i></button>
            </div>
            
            <canvas id="viewer-canvas"></canvas>
            
            <!-- Status Bar -->
            <div id="status-bar" class="status-bar">Ready</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
