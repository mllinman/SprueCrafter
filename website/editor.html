<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - SprueCrafter Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdns.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #00f2ff;
            --text-primary: #fff;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scrollalble-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2ff 0%, #0077ff 100%);
            border: none;
            font-weight: 600;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* Viewport */
        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* Floating Toolbar */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        
        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tool-btn.active {
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent-primary);
            border-color: rgba(0, 242, 255, 0.3);
        }

        /* Overlay Loader */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" style="color: #fff; text-decoration: none;">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h3 style="margin: 0; font-size: 1.1rem;">Sprue Settings</h3>
            </div>
            
            <div class="scrollalble-content">
                <div class="control-group">
                    <label class="control-label">Connector Type</label>
                    <select class="btn" style="text-align: left;">
                        <option>Cylindrical (Standard)</option>
                        <option>Pyramid (Pro)</option>
                        <option>Spherical (Pro)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">Sprue Density</label>
                    <input type="range" style="width: 100%;">
                </div>
            </div>

            <div style="padding: 1.5rem; border-top: 1px solid var(--border-color);">
                <button class="btn btn-primary">Generate Sprues</button>
            </div>
        </div>

        <!-- 3D Viewport -->
        <div class="viewport">
            <div class="toolbar">
                <button class="tool-btn active" title="Orbit"><i class="fas fa-cube"></i></button>
                <button class="tool-btn" title="Move"><i class="fas fa-arrows-alt"></i></button>
                <button class="tool-btn" title="Rotate"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--accent-primary); margin-bottom: 1rem;"></i>
        <h3 id="loading-text">Loading Application...</h3>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Inline Editor Logic (Start with simple boilerplate)
        let camera, scene, renderer, controls;
        
        document.addEventListener('DOMContentLoaded', async () => {
             // Auth Check
             if (!localStorage.getItem('auth_token') && !localStorage.getItem('is_guest')) {
                 window.location.href = 'login.html';
                 return;
             }
             
             init3D();
             
             // Simulate loading file from dashboard
             setTimeout(() => {
                 document.getElementById('loader').style.display = 'none';
             }, 1000);
        });

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b); // Fallback color
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 5;
            camera.position.y = 2;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Grid
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Controls (Orbit) - Assuming OrbitControls is loaded from CDN as script tag
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
            } else {
                 console.warn("OrbitControls not loaded, checking global namespace");
                 // Sometimes CDN exports roughly, but we'll survive without for MVP demo
            }

            // Dummy Object (Cube)
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshPhongMaterial({ color: 0x00f2ff, flatShading: true });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            animate();

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
