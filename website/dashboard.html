<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - SprueCrafter</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 1rem;
        }

        .upload-zone:hover,
        .upload-zone.highlight {
            border-color: #00f2ff;
            background: rgba(0, 242, 255, 0.05);
        }

        .upload-zone i {
            font-size: 2.5rem;
            color: #64748b;
            margin-bottom: 1rem;
        }

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            z-index: 5;
        }

        .lock-overlay i {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .lock-overlay p {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="logo">
            <i class="fas fa-cube"></i> SprueCrafter <span>Studio</span>
        </div>
        <div class="user-menu">
            <span id="user-name">Loading...</span>
            <button onclick="logout()" class="btn-text">Log Out</button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="editor.html" class="nav-item">
                    <i class="fas fa-layer-group"></i> New Project
                </a>
                <a href="datasets.html" class="nav-item">
                    <i class="fas fa-database"></i> Datasets
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="hero-section">
                <h1>Welcome back, <span id="welcome-name" class="text-gradient">Creator</span></h1>
                <p>Ready to start your next generation?</p>
            </div>

            <div class="dashboard-grid">
                <!-- Upload Card -->
                <div class="feature-card large">
                    <div class="card-header">
                        <i class="fas fa-cloud-upload-alt icon"></i>
                        <h3>Quick Upload</h3>
                    </div>
                    <div id="upload-zone" class="upload-zone">
                        <p>Drop STL/OBJ files here</p>
                        <span class="sub-text">or click to browse</span>
                        <input type="file" id="file-input" hidden accept=".stl,.obj,.fbx,.3ds,.ply,.gltf,.glb,.dae">
                    </div>
                    <div id="upload-status"></div>
                </div>

                <!-- Membership Card -->
                <div class="feature-card">
                    <div class="card-header">
                        <i class="fas fa-crown icon"></i>
                        <h3>Membership</h3>
                    </div>
                    <div id="sub-status" class="status-badge">Checking...</div>
                    <div id="sub-action-area" style="margin-top: 1rem;"></div>
                </div>

                <!-- Recent Projects (Placeholder) -->
                <div class="feature-card">
                    <div class="card-header">
                        <i class="fas fa-history icon"></i>
                        <h3>Recent Imports</h3>
                    </div>
                    <p class="empty-state">No recent files.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Essential Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
