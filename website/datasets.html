<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets - SprueCrafter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* Dataset Specific Styles */
        .dataset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .dataset-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .dataset-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .dataset-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .dataset-icon {
            width: 40px;
            height: 40px;
            background: rgba(34, 197, 94, 0.1); /* Green for data */
            color: #22c55e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .dataset-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            display: flex;
            gap: 15px;
        }

        .dataset-columns {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .upload-modal.active { display: flex; }
        
        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="logo">
            <i class="fas fa-cube"></i> SprueCrafter <span>Data</span>
        </div>
        <div class="user-menu">
            <span id="user-name">Loading...</span>
            <button onclick="logout()" class="btn-text">Log Out</button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="editor.html" class="nav-item">
                    <i class="fas fa-layer-group"></i> 3D Projects
                </a>
                <a href="datasets.html" class="nav-item active">
                    <i class="fas fa-database"></i> Datasets
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>My Datasets</h1>
                <button onclick="showUploadModal()" class="btn btn-primary">
                    <i class="fas fa-cloud-upload-alt"></i> Upload CSV
                </button>
            </div>

            <div id="datasets-list" class="dataset-grid">
                <!-- Populated by JS -->
                <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
                    <i class="fas fa-circle-notch fa-spin"></i> Loading datasets...
                </div>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="upload-modal">
        <div class="modal-content">
            <h2>Upload Dataset</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Select a CSV file to upload. Max size 50MB.</p>
            
            <input type="file" id="csv-input" accept=".csv" style="margin-bottom: 1rem; width: 100%;">
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="hideUploadModal()" class="btn btn-outline" style="border-color: var(--border-color);">Cancel</button>
                <button onclick="handleUpload()" class="btn btn-primary" id="upload-confirm-btn">Upload</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/datasets.js"></script>
</body>
</html>
