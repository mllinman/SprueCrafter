<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SprueCrafter</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                        <path d="M16 8L20 14H12L16 8Z" fill="#000"/>
                        <rect x="14" y="14" width="4" height="10" fill="#000"/>
                        <circle cx="10" cy="22" r="2" fill="#000"/>
                        <circle cx="22" cy="22" r="2" fill="#000"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00f2ff"/>
                                <stop offset="1" stop-color="#0077ff"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </a>
                <h2>Welcome Back</h2>
                <p style="color: var(--text-secondary);">Sign in to continue to SprueCrafter</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="email" class="form-control" required placeholder="Enter your username or email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Sign In</button>
            </form>

            <div style="display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text-secondary);">
                <hr style="flex: 1; border-color: var(--border-color);">
                <span>OR</span>
                <hr style="flex: 1; border-color: var(--border-color);">
            </div>
            
            <button type="button" onclick="alert('Google Login coming soon!')" class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1rem;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
                Continue with Google
            </button>

            <button type="button" id="guest-btn" class="btn btn-outline" style="width: 100%;">
                Continue as Guest
            </button>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-secondary);">Don't have an account? <a href="register.html" style="color: var(--accent-primary);">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Guest Login Handler
        document.getElementById('guest-btn').addEventListener('click', () => {
             handleGuestLogin();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';
                
                // Real API Call
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password }) // API expects username? or email? Backend says username=data['username'] but usually email is used as username. Checking register impl: username=data['username'], email=data['email']. 
                    // Wait, backend logic: user = User.query.filter_by(username=data['username']).first()
                    // If user registers with email as username, this works. 
                    // Let's assume for now username field in register form maps to username.
                    // But standard login usually accepts email.
                    // Checking backend: register uses 'username' and 'email'. login uses 'username'. 
                    // I should probably allow email login or ensure registration enforces username.
                    // For now, I'll send email as username just in case user thinks that way, OR I should check register page.
                    // Let's look at `register` function in app_saas.py:
                    // if User.query.filter_by(username=data['username']).first(): return 'Username already exists'
                    // So username IS distinct.
                    // Users might be trying to login with email when the backend expects username.
                    // I will check if backend supports email login.
                    // Backend code: user = User.query.filter_by(username=data['username']).first()
                    // It ONLY checks username!
                    // I will update this frontend to send 'username' key, but value from email field? 
                    // No, invalid. I should check if the input is email-like.
                    // Ideally I'd fix backend to allow both. 
                    // For this step, I will stick to "username" if the UI says Email. 
                    // Wait, `login.html` asks for "Email". Backend expects "username".
                    // This is a BUG. 
                    // Backend Login: `if not user or not user.check_password(data['password']):`
                    // Backend Register: `username=data['username'], email=data['email']`
                    // So if I register as "mike" with "mike@test.com", I must login as "mike".
                    // But login form asks for "Email".
                    // I will fix the backend to accept email OR username, that's better UX.
                    // But for now, I will modify the frontend to send the input value as 'username' just to hit the endpoint.
                    // AND I will change the label to "Username or Email" (and fix backend next).
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    console.error('Login Error:', data);
                    alert(data.error || 'Login failed.');
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('Connection failed. Please check your internet.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
