<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SprueCrafter</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                        <path d="M16 8L20 14H12L16 8Z" fill="#000"/>
                        <rect x="14" y="14" width="4" height="10" fill="#000"/>
                        <circle cx="10" cy="22" r="2" fill="#000"/>
                        <circle cx="22" cy="22" r="2" fill="#000"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00f2ff"/>
                                <stop offset="1" stop-color="#0077ff"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </a>
                <h2>Welcome Back</h2>
                <p style="color: var(--text-secondary);">Sign in to continue to SprueCrafter</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Sign In</button>
            </form>

            <div style="display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text-secondary);">
                <hr style="flex: 1; border-color: var(--border-color);">
                <span>OR</span>
                <hr style="flex: 1; border-color: var(--border-color);">
            </div>

            <button class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
                Continue with Google
            </button>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-secondary);">Don't have an account? <a href="#" style="color: var(--accent-primary);">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // In a real implementation:
                // const res = await axios.post('/api/auth/login', { email, password });
                // localStorage.setItem('auth_token', res.data.access_token);
                // localStorage.setItem('user', JSON.stringify(res.data.user));
                
                // Simulation:
                localStorage.setItem('auth_token', 'demo-token');
                localStorage.setItem('user', JSON.stringify({ name: 'Demo User', email: email, is_pro: false }));
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('Login failed. Please check your credentials.');
            }
        });
    </script>
</body>
</html>
