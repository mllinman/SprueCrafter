<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SprueCrafter</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        /* Local overrides for premium login feel */
        body {
            background: radial-gradient(circle at top right, #1a2a6c, #b21f1f, #fdbb2d); /* Fallback */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }
        .bg-blob:nth-child(1) { top: -100px; right: -100px; animation-delay: 0s; }
        .bg-blob:nth-child(2) { bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(0, 119, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%); animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-container h2 {
            margin: 1rem 0 0.5rem;
            font-size: 1.75rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.8rem; /* Space for icon */
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-control:focus + i {
            color: #00f2ff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2ff 0%, #0077ff 100%);
            border: none;
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0, 242, 255, 0.5);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #64748b;
            font-size: 0.875rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .divider span {
            padding: 0 1rem;
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.875rem;
            border-radius: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .footer-text a {
            color: #00f2ff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        
        .footer-text a:hover {
            opacity: 0.8;
        }

        /* Error/Status Message */
        #status-message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

    </style>
</head>
<body>

    <!-- Background Blobs -->
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>

    <div class="auth-card">
        <div class="logo-container">
            <a href="index.html">
                <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                    <path d="M16 8L20 14H12L16 8Z" fill="#000"/>
                    <rect x="14" y="14" width="4" height="10" fill="#000"/>
                    <circle cx="10" cy="22" r="2" fill="#000"/>
                    <circle cx="22" cy="22" r="2" fill="#000"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00f2ff"/>
                            <stop offset="1" stop-color="#0077ff"/>
                        </linearGradient>
                    </defs>
                </svg>
            </a>
            <h2>Welcome Back</h2>
            <p style="color: #94a3b8; margin: 0;">Sign in to check your sprue jobs</p>
        </div>

        <!-- Status Message Container -->
        <div id="status-message"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" required placeholder="name@example.com">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            
            <div class="input-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="color: #64748b; font-size: 0.8rem; text-decoration: none;">Forgot?</a>
                </div>
                <div class="input-wrapper" style="margin-top: 0.5rem;">
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">
                <span>Sign In</span>
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <button type="button" class="btn-social" onclick="Auth.continueAsGuest()">
            <i class="fa-solid fa-user-secret"></i>
            Continue as Guest
        </button>

        <div class="footer-text">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Essential modules -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Page specific logic
        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-message');

        function showMessage(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = type === 'error' ? 'status-error' : 'status-success';
            statusMsg.style.display = 'block';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Reset UI
            statusMsg.style.display = 'none';
            submitBtn.disabled = true;
            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing In...';

            // Attempt Login
            const result = await Auth.login(username, password);

            if (result.success) {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                showMessage(result.error, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                // Shake animation
                document.querySelector('.auth-card').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        });
    </script>
</body>
</html>
